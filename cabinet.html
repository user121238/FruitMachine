<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="水果大满贯">
<title>经典复古机台 · 水果机</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#07080b; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
  }

  /* 竖版机柜外壳 */
  #cabinetFrame {
    width:100%; height:100%; max-width:540px; max-height:980px;
    background:#12141a;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:max(1vh, env(safe-area-inset-top)) 2.4vw max(1vh, env(safe-area-inset-bottom));
    box-shadow:0 0 50px rgba(0,0,0,0.9), inset 0 0 10px rgba(0,0,0,0.8);
    position:relative; overflow:hidden;
    border-left:6px solid #b91c1c; border-right:6px solid #b91c1c;
  }
  #cabinetFrame::before, #cabinetFrame::after {
    content:""; position:absolute; top:0; bottom:0; width:4px;
    background:#ef4444; box-shadow:0 0 12px #ef4444; pointer-events:none; z-index:30;
  }
  #cabinetFrame::before { left:2px; }
  #cabinetFrame::after { right:2px; }

  /* 顶部状态与积分栏 */
  #topBar {
    flex:0 0 auto; display:flex; flex-direction:column; gap:0.6vh;
    padding-bottom:0.6vh;
  }
  .playerRow {
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,0.06); border-radius:0.8vh; padding:0.4vh 1.4vw;
    border:1px solid rgba(255,255,255,0.08); font-size:1.4vh; color:#cbd5e1;
  }
  .pCard { display:flex; align-items:center; gap:0.6vw; }
  .pAvatar { width:3.4vh; height:3.4vh; border-radius:50%; background:#475569; display:flex; align-items:center; justify-content:center; font-size:1.8vh; }
  .pInfo { display:flex; flex-direction:column; font-size:1.2vh; line-height:1.2; }
  .pId { color:#e2e8f0; font-weight:800; }
  .pScore { color:#f59e0b; font-weight:900; }
  .btnTopOpt {
    padding:0.4vh 1.2vw; background:linear-gradient(180deg, #f59e0b, #d97706);
    color:#fff; border:none; border-radius:0.6vh; font-size:1.3vh; font-weight:900; cursor:pointer;
  }

  .ledRow {
    display:flex; gap:2vw; margin-top:0.4vh;
  }
  .ledPanel {
    flex:1; background:#06080d; border:2px solid #2d3748; border-radius:0.8vh;
    padding:0.4vh 1vw; box-shadow:inset 0 2px 8px #000;
  }
  .ledTitle {
    font-size:1.1vh; font-weight:900; color:#94a3b8; letter-spacing:0.12em;
    display:flex; justify-content:space-between;
  }
  .ledDigits {
    font-family:"Courier New", monospace; font-size:3.2vh; font-weight:900;
    text-align:right; color:#ef4444; letter-spacing:0.1em;
    text-shadow:0 0 10px rgba(239,68,68,0.7), 0 0 2px #fff;
    white-space:nowrap; overflow:hidden;
  }

  /* 7x7 跑灯核心网格 */
  #trackArea {
    flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center;
    padding:0.6vh 0; position:relative;
  }
  #trackGrid {
    width:100%; aspect-ratio:1/1; max-height:48vh;
    display:grid; grid-template-columns:repeat(7, 1fr); grid-template-rows:repeat(7, 1fr);
    gap:4px; position:relative;
  }

  /* 单个灯位样式 (复刻截图中轻石色微弧方块) */
  .lampCell {
    border-radius:6px; background:#ede8df;
    border:1.5px solid #8e877e;
    box-shadow:inset 0 1.5px 0 #fff, 0 2px 4px rgba(0,0,0,0.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden; transition:filter 0.1s;
  }
  .lampCell.barCell { background:#cbb28d; border-color:#8a7051; }
  .lampCell.greenLuck {
    background:radial-gradient(circle, #0e7490, #155e75); border-color:#0891b2;
  }
  .lampCell.orangeLuck {
    background:radial-gradient(circle, #d97706, #b45309); border-color:#f59e0b;
  }

  /* 中奖/跑灯高亮态 (璀璨金色电光) */
  .lampCell.lit {
    background:linear-gradient(180deg, #ffea79 0%, #f59e0b 100%) !important;
    border-color:#b45309 !important;
    box-shadow:0 0 18px #f59e0b, 0 0 30px #f59e0b, inset 0 0 10px #ffffff !important;
    z-index:10; transform:scale(1.04);
  }

  .lampImg {
    width:70%; height:70%; object-fit:contain;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));
    pointer-events:none;
  }
  .lampSubOdds {
    font-size:1vh; font-weight:900; color:#1e293b;
    font-family:"Courier New", monospace; line-height:1; margin-top:-2px;
  }
  .barTextBadge {
    font-size:0.9vh; font-weight:900; color:#3b2a1a; text-align:center; line-height:1.1;
  }

  /* 中心内嵌视窗 (5x5 区域) */
  #centerStage {
    grid-area:2 / 2 / 7 / 7;
    border-radius:8px; overflow:hidden; position:relative;
    border:2px solid #334155;
    box-shadow:inset 0 0 20px rgba(0,0,0,0.8);
    display:flex; flex-direction:column; justify-content:space-between;
    align-items:center; padding:1.2vh 1.4vw;
    background:#181224 url('images/char_bg.jpg') no-repeat center 18%;
    background-size:cover;
  }
  #centerStage::before {
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.5) 100%);
    pointer-events:none;
  }

  .centerTopBadge {
    display:flex; align-items:center; gap:0.6vw;
    background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.15);
    border-radius:1.2vh; padding:0.4vh 1.2vw; font-size:1.5vh; font-weight:900;
    color:#f8fafc; z-index:2;
  }
  .btnChipToggle {
    background:#10b981; border:none; border-radius:50%; width:2.2vh; height:2.2vh;
    color:#fff; font-size:1.2vh; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  .jpSeal {
    width:7.2vh; height:7.2vh; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fef08a, #ca8a04 70%, #854d0e 100%);
    box-shadow:0 0 20px rgba(234,179,8,0.5), inset 0 2px 0 #fff;
    border:2px solid #713f12;
    display:flex; align-items:center; justify-content:center;
    font-size:2.8vh; font-weight:900; color:#713f12; letter-spacing:0.04em;
    text-shadow:0 1px 0 rgba(255,255,255,0.6); z-index:2;
  }

  .centerLedDisplay {
    background:#06080d; border:2px solid #1e293b; border-radius:0.6vh;
    padding:0.2vh 1.4vw; min-width:60px; text-align:center;
    font-family:"Courier New", monospace; font-size:3.2vh; font-weight:900;
    color:#ef4444; text-shadow:0 0 8px #ef4444; z-index:2;
  }

  /* 中部控制按键排 (◀, ▶, 1-6, 8-13, Reset, GO) */
  #actionRow {
    flex:0 0 auto; display:flex; gap:1.2vw; align-items:center;
    padding:0.6vh 0;
  }
  .btnAction {
    flex:1; height:5.8vh; border-radius:1.2vh; border:none; cursor:pointer;
    font-size:1.8vh; font-weight:900; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    transition:transform 0.1s, filter 0.1s;
  }
  .btnAction:active { transform:translateY(2px); }
  .btnAction:disabled { opacity:0.35; cursor:not-allowed; filter:grayscale(0.8); }

  .btnGreenArrow {
    background:linear-gradient(180deg, #4ade80, #15803d); color:#064e3b;
    font-size:2.4vh; border:1px solid #166534;
  }
  .btnGambleAmber {
    background:linear-gradient(180deg, #fcd34d, #b45309); color:#451a03;
    border:1px solid #78350f;
  }
  .btnGambleAmber.glow { animation:gambleFlash 0.7s infinite alternate; }
  @keyframes gambleFlash {
    from { filter:brightness(1); }
    to { filter:brightness(1.3); box-shadow:0 0 16px #f59e0b; }
  }
  .btnResetGray {
    background:linear-gradient(180deg, #e2e8f0, #475569); color:#0f172a;
    border:1px solid #334155;
  }
  .btnGoRed {
    flex:1.4; height:6.4vh; border-radius:1.4vh;
    background:radial-gradient(circle at 35% 30%, #ef4444, #991b1b 75%, #450a0a);
    color:#fff; font-size:2.8vh; font-weight:900; letter-spacing:0.06em;
    border:1px solid #7f1d1d;
    box-shadow:0 6px 16px rgba(239,68,68,0.4), inset 0 2px 0 rgba(255,255,255,0.5);
  }
  .btnGoRed.pulse { animation:goPulse 1s infinite alternate; }

  /* 底部 8 门押注控制台 (复刻下半部经典阵列) */
  #betConsole {
    flex:0 0 auto;
    background:#081014; border:2px solid #1e293b; border-radius:1vh;
    padding:0.6vh 0.6vw; display:flex; flex-direction:column; gap:0.4vh;
    box-shadow:inset 0 2px 8px #000;
  }
  .deckRow {
    display:grid; grid-template-columns:repeat(8, 1fr); gap:1vw;
  }

  /* 赔率显示区 */
  .oddsCell {
    background:#0b191a; border:1px solid #134e4a; border-radius:4px;
    padding:0.4vh 0; text-align:center;
    font-family:"Courier New", monospace; font-size:1.8vh; font-weight:900;
    color:#34d399; text-shadow:0 0 6px rgba(52,211,153,0.5);
  }
  .oddsCell.winHit {
    background:#ef4444 !important; color:#fff !important;
    text-shadow:0 0 10px #fff !important;
    animation:oddsFlash 0.4s infinite alternate;
  }
  @keyframes oddsFlash {
    from { opacity:1; } to { opacity:0.6; }
  }

  /* LED 下注数额区 */
  .betLedCell {
    background:#000; border:1px solid #27272a; border-radius:4px;
    padding:0.2vh 0; text-align:center;
    font-family:"Courier New", monospace; font-size:2.4vh; font-weight:900;
    color:#ef4444; text-shadow:0 0 8px rgba(239,68,68,0.8);
  }

  /* 实体推压按键区 */
  .btnBetPush {
    aspect-ratio:1/1; border-radius:50%; border:2px solid #15803d;
    background:radial-gradient(circle at 35% 30%, #22c55e, #15803d 70%, #14532d);
    box-shadow:0 4px 8px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.4);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0.4vh; transition:transform 0.1s;
  }
  .btnBetPush:active { transform:scale(0.92); }
  .btnBetImg {
    width:80%; height:80%; object-fit:contain;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    pointer-events:none;
  }

  /* 提示与弹窗 */
  #toast {
    position:fixed; top:16vh; left:50%; transform:translateX(-50%);
    padding:1vh 2vw; background:rgba(15,23,42,0.95); border:1px solid #f59e0b;
    border-radius:0.8vh; color:#fff; font-size:1.8vh; font-weight:900;
    box-shadow:0 10px 30px rgba(0,0,0,0.8); opacity:0; pointer-events:none;
    transition:opacity 0.2s; z-index:100;
  }
  #toast.show { opacity:1; }

  /* 历史弹窗 */
  #histModal {
    position:fixed; inset:0; z-index:200; display:none;
    align-items:center; justify-content:center; background:rgba(0,0,0,0.85);
  }
  #histModal.show { display:flex; }
  .modalBox {
    width:90%; max-width:480px; max-height:80%; background:#1e293b;
    border:1px solid #475569; border-radius:1vh; padding:1.4vh 1.4vw;
    display:flex; flex-direction:column; gap:1vh;
  }
  .modalHeader { display:flex; justify-content:space-between; align-items:center; }
  .modalBody { flex:1; overflow-y:auto; font-size:1.5vh; }
  .histTable { width:100%; border-collapse:collapse; text-align:left; }
  .histTable th, .histTable td { padding:0.6vh 0.6vw; border-bottom:1px solid #334155; }
</style>
</head>
<body>
<div id="cabinetFrame">
  <!-- 顶部玩家与数码仪表 -->
  <div id="topBar">
    <div class="playerRow">
      <div class="pCard">
        <div class="pAvatar">👤</div>
        <div class="pInfo">
          <span class="pId">VIP-8888</span>
          <span class="pScore">在线连线</span>
        </div>
      </div>
      <div style="display:flex;gap:1.4vw;">
        <button class="btnTopOpt" id="btnHist">战报</button>
        <button class="btnTopOpt" id="btnAudio">音效</button>
        <button class="btnTopOpt" id="btnDeposit">+1000</button>
      </div>
    </div>
    <div class="ledRow">
      <div class="ledPanel">
        <div class="ledTitle"><span>BONUS WIN</span><span>中奖</span></div>
        <div class="ledDigits" id="meterWin">00000000</div>
      </div>
      <div class="ledPanel">
        <div class="ledTitle"><span>CREDIT</span><span>可用余额</span></div>
        <div class="ledDigits" id="meterCredit">00001000</div>
      </div>
    </div>
  </div>

  <!-- 中部 7x7 跑灯阵列 -->
  <div id="trackArea">
    <div id="trackGrid">
      <!-- 24 盏外围灯位由脚本依据 7x7 顺时针网格绝对生成 -->
      <div id="centerStage">
        <div class="centerTopBadge">
          <span>1注 = <b id="chipText" style="color:#f59e0b;">10</b> 金币</span>
          <button class="btnChipToggle" id="btnChipToggle">↻</button>
        </div>
        <div class="jpSeal">JP</div>
        <div class="centerLedDisplay" id="centerNum">0</div>
      </div>
    </div>
  </div>

  <!-- 中部操作键排 (◀, ▶, 1-6, 8-13, Reset, GO) -->
  <div id="actionRow">
    <button class="btnAction btnGreenArrow" id="btnHalf">◀</button>
    <button class="btnAction btnGreenArrow" id="btnAll">▶</button>
    <button class="btnAction btnGambleAmber" id="btnGambleSmall">1-6</button>
    <button class="btnAction btnGambleAmber" id="btnGambleBig">8-13</button>
    <button class="btnAction btnResetGray" id="btnReset">Reset</button>
    <button class="btnAction btnGoRed pulse" id="btnGo">GO</button>
  </div>

  <!-- 底部 8 门押注控制台 (120, 40, 30, 20, 20, 15, 10, 5) -->
  <div id="betConsole">
    <div class="deckRow" id="oddsRow"></div>
    <div class="deckRow" id="betsLedRow"></div>
    <div class="deckRow" id="pushBtnRow"></div>
  </div>
</div>

<div id="toast"></div>

<div id="histModal">
  <div class="modalBox">
    <div class="modalHeader">
      <h3 style="color:#f59e0b;">📜 历史战报</h3>
      <button class="btnTopOpt" id="btnCloseHist">✕ 关闭</button>
    </div>
    <div class="modalBody">
      <table class="histTable">
        <thead>
          <tr><th>时间</th><th>开奖变体</th><th>本局注</th><th>中奖得分</th></tr>
        </thead>
        <tbody id="histBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="images.js"></script>
<script>
'use strict';
if (typeof IMGS === 'undefined') window.IMGS = {};

const PARENTS = [
  {name:'橙子', imgKey:'orange',     color:'#f59e0b', colorDark:'#b45309'},
  {name:'苹果', imgKey:'apple',      color:'#ef4444', colorDark:'#991b1b'},
  {name:'柠檬', imgKey:'lemon',      color:'#eab308', colorDark:'#854d0e'},
  {name:'铃铛', imgKey:'bell',       color:'#fbbf24', colorDark:'#b45309'},
  {name:'西瓜', imgKey:'watermelon', color:'#10b981', colorDark:'#047857'},
  {name:'双星', imgKey:'star',       color:'#8b5cf6', colorDark:'#5b21b6'},
  {name:'77',   imgKey:'seven',      color:'#ec4899', colorDark:'#9d174d'},
  {name:'BAR',  imgKey:'bar',        color:'#e2e8f0', colorDark:'#475569', bar:true},
];
const PARENT_N = PARENTS.length;

// 下方 8 门在机台中的展示顺序：BAR(120), 77(40), 双星(30), 西瓜(20), 铃铛(20), 柠檬(15), 橙子(10), 苹果(5)
const DECK_ORDER = [7, 6, 5, 4, 3, 2, 0, 1];
const DECK_ODDS_DISPLAY = [120, 40, 30, 20, 20, 15, 10, 5];

const SYMS = [
  {p:0, name:'大橙子', odds:10,  weight:90,  imgKey:'orange'},
  {p:0, name:'小橙子', odds:3,   weight:20,  small:true, imgKey:'orange'},
  {p:1, name:'大苹果', odds:5,   weight:220, imgKey:'apple'},
  {p:1, name:'小苹果', odds:3,   weight:30,  small:true, imgKey:'apple'},
  {p:2, name:'大柠檬', odds:15,  weight:60,  imgKey:'lemon'},
  {p:2, name:'小柠檬', odds:3,   weight:15,  small:true, imgKey:'lemon'},
  {p:3, name:'大铃铛', odds:20,  weight:42,  imgKey:'bell'},
  {p:3, name:'小铃铛', odds:3,   weight:12,  small:true, imgKey:'bell'},
  {p:4, name:'大西瓜', odds:20,  weight:42,  imgKey:'watermelon'},
  {p:4, name:'小西瓜', odds:3,   weight:12,  small:true, imgKey:'watermelon'},
  {p:5, name:'双星',   odds:30,  weight:30,  imgKey:'star'},
  {p:5, name:'小双星', odds:3,   weight:10,  small:true, imgKey:'star'},
  {p:6, name:'77',     odds:40,  weight:22,  imgKey:'seven'},
  {p:6, name:'小77',   odds:3,   weight:8,   small:true, imgKey:'seven'},
  {p:7, name:'单BAR',  odds:50,  weight:12,  bar:1, imgKey:'bar'},
  {p:7, name:'大BAR',  odds:120, weight:5,   bar:2, imgKey:'bar'},
  {p:-1, name:'绿LUCK', odds:0,  weight:15,  luck:'green', imgKey:'ingots'},
  {p:-1, name:'橙LUCK', odds:0,  weight:15,  luck:'orange', imgKey:'ingots'},
];
const SYM_N = SYMS.length;
const TOTAL_WEIGHT = SYMS.reduce((sum, s) => sum + s.weight, 0);

const LAMPS = [0, 6, 14, 15, 2, 3, 4, 8, 9, 16, 2, 1, 0, 6, 13, 12, 2, 5, 4, 10, 11, 17, 2, 7];
const LAMP_N = LAMPS.length;

// 7x7 网格外沿 24 盏灯位的顺时针行/列映射 (1-based grid)
const GRID_POS = [
  // 顶边 7 盏 (0 ~ 6)
  {r:1, c:1}, {r:1, c:2}, {r:1, c:3}, {r:1, c:4}, {r:1, c:5}, {r:1, c:6}, {r:1, c:7},
  // 右边 5 盏 (7 ~ 11)
  {r:2, c:7}, {r:3, c:7}, {r:4, c:7}, {r:5, c:7}, {r:6, c:7},
  // 底边 7 盏 (12 ~ 18: 右到左)
  {r:7, c:7}, {r:7, c:6}, {r:7, c:5}, {r:7, c:4}, {r:7, c:3}, {r:7, c:2}, {r:7, c:1},
  // 左边 5 盏 (19 ~ 23: 底到顶)
  {r:6, c:1}, {r:5, c:1}, {r:4, c:1}, {r:3, c:1}, {r:2, c:1}
];

const ODDS_RANGE = [
  {min:3, max:10}, {min:3, max:5}, {min:3, max:15}, {min:3, max:20},
  {min:3, max:20}, {min:3, max:30}, {min:3, max:40}, {min:50, max:120}
];

const LUCK_EVENTS = [
  { type: 'train', name: '开火车(3灯)', count: 3, weight: 22 },
  { type: 'train', name: '开火车(4灯)', count: 4, weight: 16 },
  { type: 'train', name: '开火车(5灯)', count: 5, weight: 10 },
  { type: 'fixed', name: '小三元', targets: [8, 14, 20], weight: 15 },
  { type: 'fixed', name: '大三元', targets: [7, 15, 19], weight: 8 },
  { type: 'fixed', name: '小四喜', targets: [11, 5, 17, 23], weight: 12 },
  { type: 'fixed', name: '大四喜', targets: [0, 4, 6, 1], weight: 7 },
  { type: 'scatter', name: '满天飞雨(4灯)', count: 4, weight: 14 },
  { type: 'bar_strike', name: '送大BAR', target: 3, weight: 5 },
  { type: 'grand_slam', name: '大满贯(全盘奖)', weight: 3 }
];
const LUCK_TOTAL_WEIGHT = LUCK_EVENTS.reduce((s, e) => s + e.weight, 0);

function pickTarget() {
  let r = Math.random() * TOTAL_WEIGHT;
  for (let fi = 0; fi < SYM_N; fi++) {
    r -= SYMS[fi].weight;
    if (r <= 0) {
      const cands = [];
      for (let li = 0; li < LAMP_N; li++) {
        if (LAMPS[li] === fi) cands.push(li);
      }
      return cands[Math.floor(Math.random() * cands.length)];
    }
  }
  return 0;
}

function pickLuckEvent() {
  let r = Math.random() * LUCK_TOTAL_WEIGHT;
  for (const ev of LUCK_EVENTS) {
    r -= ev.weight;
    if (r <= 0) return ev;
  }
  return LUCK_EVENTS[0];
}

let audioCtx = null;
function getAc() {
  if (!audioCtx) {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (AudioCtor) audioCtx = new AudioCtor();
  }
  return audioCtx;
}

function sndOsc(freq, duration, type = 'sine', gainVal = 0.2) {
  if (S.muted) return;
  const ctx = getAc(); if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, now);
  gain.gain.setValueAtTime(gainVal, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + duration);
}
function sndTick() { sndOsc(1200, 0.04, 'triangle', 0.12); }
function sndThud() { sndOsc(160, 0.14, 'square', 0.15); }
function sndClick() { sndOsc(900, 0.03, 'sine', 0.1); }
function sndCoin() {
  if (S.muted) return;
  const ctx = getAc(); if (!ctx) return;
  const now = ctx.currentTime;
  [987.77, 1318.5].forEach((f, i) => {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(f, now + i * 0.06);
    g.gain.setValueAtTime(0.2, now + i * 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.06 + 0.22);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.22);
  });
}
function sndWin(big = false) {
  if (S.muted) return;
  const notes = big ? [523, 659, 784, 1046, 1318] : [523, 659, 784, 1046];
  notes.forEach((n, i) => setTimeout(() => sndOsc(n, 0.2, 'sine', 0.22), i * 90));
}
function sndSiren() {
  if (S.muted) return;
  const ctx = getAc(); if (!ctx) return;
  const now = ctx.currentTime;
  for (let i = 0; i < 4; i++) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, now + i * 0.18);
    osc.frequency.linearRampToValueAtTime(1400, now + i * 0.18 + 0.15);
    g.gain.setValueAtTime(0.18, now + i * 0.18);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.17);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now + i * 0.18); osc.stop(now + i * 0.18 + 0.18);
  }
}
function sndTrain(step = 0) {
  if (S.muted) return;
  const ctx = getAc(); if (!ctx) return;
  const now = ctx.currentTime;
  [1046.5, 1318.5].forEach(f => {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(f, now);
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.35);
  });
}

const CHIP_OPTS = [1, 5, 10, 50, 100, 500];
let chipIndex = 2; // default 10
const BET_CAP = 9999;
const S = { credits: 1000, bets: new Array(PARENT_N).fill(0), chip: 10, muted: false, spinning: false };
let pendingWin = 0;
let needResetBets = false;

try {
  const saved = JSON.parse(localStorage.getItem("fruit_cabinet_state") || "{}");
  if (typeof saved.credits === "number") S.credits = saved.credits;
  if (typeof saved.pendingWin === "number") pendingWin = saved.pendingWin;
  if (Array.isArray(saved.bets) && saved.bets.length === PARENT_N) S.bets = saved.bets;
} catch (e) {}
needResetBets = S.bets.reduce((a, b) => a + b, 0) > 0;

function saveState() {
  try {
    localStorage.setItem("fruit_cabinet_state", JSON.stringify({
      credits: S.credits, pendingWin: pendingWin, bets: S.bets
    }));
  } catch (e) {}
}

const totalBet = () => S.bets.reduce((a, b) => a + b, 0);
const isBusy = () => S.spinning;

const wheel = {
  pos: 0, speed: 0, phase: "idle", target: 0, targetFruit: 0,
  luckEvent: null, luckWonLamps: [], luckStep: 0, luckTimer: 0,
  trainStart: 0, trainPhase: "run", trainLamps: [], t: 0
};
const lightOf = (idx) => ((Math.round(idx) % LAMP_N) + LAMP_N) % LAMP_N;

function startLuckMode() {
  const ev = pickLuckEvent();
  wheel.luckEvent = ev;
  wheel.luckWonLamps = [];
  wheel.luckStep = 0;
  wheel.luckTimer = 0;

  if (ev.type === "train") {
    let start = Math.floor(Math.random() * LAMP_N);
    while (SYMS[LAMPS[start]].luck) start = (start + 1) % LAMP_N;
    wheel.trainStart = start;
    wheel.trainPhase = "run";
    const trainLamps = [];
    let cur = start;
    while (trainLamps.length < ev.count) {
      if (!SYMS[LAMPS[cur]].luck) trainLamps.push(cur);
      cur = (cur + 1) % LAMP_N;
    }
    wheel.trainLamps = trainLamps;
  }
  wheel.phase = "luck_intro";
  wheel.t = 0;
  sndSiren();
  showToast(`⚡ 触发送灯大奖【${ev.name}】！`);
}

function updateLuckEngine(dt) {
  const ev = wheel.luckEvent;
  if (!ev) { wheel.phase = "idle"; return; }
  wheel.luckTimer += dt;

  switch (ev.type) {
    case "train": {
      if (wheel.trainPhase === "run") {
        wheel.pos += 26 * dt;
        if (Math.floor(wheel.pos) % 2 === 0) sndTick();
        if (wheel.luckTimer >= 1.1) {
          wheel.pos = wheel.trainStart;
          wheel.trainPhase = "expand";
          wheel.luckTimer = 0;
          wheel.luckStep = 0;
          sndTrain(0);
        }
      } else {
        if (wheel.luckTimer >= 0.35) {
          wheel.luckTimer = 0;
          if (wheel.luckStep < wheel.trainLamps.length) {
            const nextLamp = wheel.trainLamps[wheel.luckStep];
            wheel.luckWonLamps.push(nextLamp);
            wheel.pos = nextLamp;
            sndTrain(wheel.luckStep + 1);
            wheel.luckStep++;
          } else {
            wheel.phase = "luck_blink";
            wheel.t = 0;
          }
        }
      }
      break;
    }
    case "fixed": {
      if (wheel.luckTimer >= 0.45) {
        wheel.luckTimer = 0;
        if (wheel.luckStep < ev.targets.length) {
          const lampIdx = ev.targets[wheel.luckStep];
          wheel.luckWonLamps.push(lampIdx);
          wheel.pos = lampIdx;
          sndOsc(540 + wheel.luckStep * 140, 0.22, "triangle", 0.2);
          wheel.luckStep++;
        } else {
          wheel.phase = "luck_blink";
          wheel.t = 0;
        }
      }
      break;
    }
    case "scatter": {
      if (wheel.luckTimer >= 0.38) {
        wheel.luckTimer = 0;
        if (wheel.luckStep < ev.count) {
          const cands = [];
          for (let i = 0; i < LAMP_N; i++) {
            if (!SYMS[LAMPS[i]].luck && !wheel.luckWonLamps.includes(i)) cands.push(i);
          }
          const chosen = cands[Math.floor(Math.random() * cands.length)] ?? 0;
          wheel.luckWonLamps.push(chosen);
          wheel.pos = chosen;
          sndOsc(260, 0.09, "square", 0.25);
          wheel.luckStep++;
        } else {
          wheel.phase = "luck_blink";
          wheel.t = 0;
        }
      }
      break;
    }
    case "bar_strike": {
      if (wheel.luckTimer >= 0.22) {
        wheel.luckTimer = 0;
        const cur = lightOf(wheel.pos);
        if (cur !== ev.target) {
          wheel.pos = (cur + 1) % LAMP_N;
          sndTick();
        } else {
          wheel.luckWonLamps = [ev.target];
          wheel.phase = "luck_blink";
          wheel.t = 0;
        }
      }
      break;
    }
    case "grand_slam": {
      wheel.pos += 30 * dt;
      if (Math.floor(wheel.pos) % 2 === 0) sndTick();
      if (wheel.luckTimer >= 2.2) {
        wheel.luckWonLamps = Array.from({length: LAMP_N}, (_, i) => i);
        wheel.phase = "luck_blink";
        wheel.t = 0;
      }
      break;
    }
  }
}

function updateWheel(dt) {
  wheel.t += dt;
  const lastLit = lightOf(wheel.pos);

  switch (wheel.phase) {
    case "accel": {
      wheel.speed = Math.min(32, wheel.speed + 46 * dt);
      wheel.pos += wheel.speed * dt;
      if (wheel.t > 0.8) { wheel.phase = "cruise"; wheel.t = 0; }
      break;
    }
    case "cruise": {
      wheel.pos += wheel.speed * dt;
      if (wheel.t > 1.2) {
        wheel.phase = "decel"; wheel.t = 0;
        const currentLit = lightOf(wheel.pos);
        const dist = ((wheel.target - currentLit) % LAMP_N + LAMP_N) % LAMP_N;
        wheel.decelStartPos = wheel.pos;
        wheel.decelTotal = LAMP_N * 2 + dist;
        wheel.decelDuration = 2.4;
      }
      break;
    }
    case "decel": {
      const p = Math.min(1, wheel.t / wheel.decelDuration);
      const ease = 1 - Math.pow(1 - p, 3);
      wheel.pos = wheel.decelStartPos + wheel.decelTotal * ease;
      if (p >= 1) {
        wheel.pos = wheel.target;
        wheel.speed = 0;
        if (SYMS[wheel.targetFruit]?.luck) startLuckMode();
        else { wheel.phase = "blink"; wheel.t = 0; }
      }
      break;
    }
    case "blink": {
      if (wheel.t > 1.4) {
        wheel.phase = "idle";
        resolveRound();
      }
      break;
    }
    case "luck_intro": {
      if (wheel.t > 0.8) {
        wheel.phase = "luck_anim"; wheel.t = 0; wheel.luckTimer = 0;
      }
      break;
    }
    case "luck_anim": { updateLuckEngine(dt); break; }
    case "luck_blink": {
      if (wheel.t > 1.8) {
        wheel.phase = "idle";
        resolveLuckRound();
      }
      break;
    }
  }

  if (wheel.phase !== "idle" && wheel.phase !== "blink" && wheel.phase !== "luck_blink") {
    const curLit = lightOf(wheel.pos);
    if (curLit !== lastLit) sndTick();
  }
}

function renderLamps(now) {
  const lit = lightOf(wheel.pos);
  const isLuckActive = wheel.phase === "luck_anim" || wheel.phase === "luck_blink";

  for (let i = 0; i < LAMP_N; i++) {
    const el = document.getElementById("lamp" + i);
    if (!el) continue;

    let isLit = false;
    if (wheel.phase === "blink") {
      isLit = (i === wheel.target) && (Math.floor(now / 130) % 2 === 0);
    } else if (wheel.phase === "luck_blink") {
      isLit = wheel.luckWonLamps.includes(i) && (Math.floor(now / 130) % 2 === 0);
    } else if (isLuckActive) {
      isLit = (i === lit) || wheel.luckWonLamps.includes(i);
    } else if (wheel.phase !== "idle") {
      isLit = (i === lit);
    }
    el.classList.toggle("lit", isLit);
  }

  // 中央内视窗数字
  const centerEl = document.getElementById("centerNum");
  if (wheel.phase === "accel" || wheel.phase === "cruise" || wheel.phase === "decel") {
    centerEl.textContent = String(Math.floor(wheel.pos) % 100);
  } else if (wheel.phase === "blink" || wheel.phase === "luck_blink") {
    centerEl.textContent = SYMS[wheel.targetFruit]?.odds ? String(SYMS[wheel.targetFruit].odds) : "JP";
  } else {
    centerEl.textContent = pendingWin > 0 ? String(pendingWin) : "0";
  }
}

function placeBet(pi) {
  if (isBusy()) return;
  collectPending();
  if (needResetBets) {
    S.bets.fill(0);
    needResetBets = false;
  }
  if (S.credits - totalBet() < S.chip) {
    showToast("分数不足，请先上分");
    sndThud(); return;
  }
  S.bets[pi] = Math.min(BET_CAP, S.bets[pi] + S.chip);
  sndClick();
  renderUI();
}

function collectPending() {
  if (pendingWin > 0) {
    S.credits += pendingWin;
    pendingWin = 0;
    sndCoin();
    saveState();
  }
}

function spin() {
  if (isBusy()) return;
  if (pendingWin > 0) {
    collectPending();
    renderUI();
    showToast("奖金已收回余额 · 再次点击开跑");
    return;
  }
  needResetBets = false;
  const tb = totalBet();
  if (tb === 0) { showToast("请先选择水果下注"); sndThud(); return; }
  if (tb > S.credits) { showToast("余额不足，请先充值"); sndThud(); return; }

  S.credits -= tb; saveState(); S.spinning = true;
  wheel.luckWonLamps = []; wheel.luckEvent = null;
  wheel.target = pickTarget(); wheel.targetFruit = LAMPS[wheel.target];
  wheel.phase = "accel"; wheel.t = 0; wheel.speed = 0;
  renderUI();
}

function resolveRound() {
  S.spinning = false;
  needResetBets = true;
  const fi = wheel.targetFruit, F = SYMS[fi];
  const win = S.bets[F.p] * F.odds;

  recordHistory(`${F.name} ×${F.odds}`, win, false);

  if (win > 0) {
    pendingWin = win; saveState();
    sndWin(win >= 500);
    showToast(`中奖 ${F.name} ×${F.odds}！赢得 ${win.toLocaleString()} 分`);
  } else {
    sndThud(); showToast(`${F.name} ×${F.odds} · 未中`);
  }
  renderUI();
}

function resolveLuckRound() {
  S.spinning = false;
  needResetBets = true;
  const ev = wheel.luckEvent;
  if (!ev) { renderUI(); return; }

  let totalWin = 0;
  if (ev.type === "grand_slam") {
    for (let pi = 0; pi < PARENT_N; pi++) {
      const b = S.bets[pi];
      if (b > 0) totalWin += b * ODDS_RANGE[pi].max;
    }
    if (totalWin === 0) totalWin = 888;
  } else {
    wheel.luckWonLamps.forEach(idx => {
      const fi = LAMPS[idx], F = SYMS[fi];
      if (F && F.p >= 0) totalWin += S.bets[F.p] * F.odds;
    });
  }

  recordHistory(`LUCK·${ev.name}`, totalWin, true);

  if (totalWin > 0) {
    pendingWin = totalWin; saveState(); sndWin(true); sndTrain(2);
    showToast(`🎉【${ev.name}】赢得 ${totalWin.toLocaleString()} 分！`);
  } else {
    sndThud(); showToast(`🎰【${ev.name}】未押中送出项`);
  }
  renderUI();
}

function gambleDice(isBig) {
  if (isBusy() || pendingWin <= 0) return;
  const r1 = Math.floor(Math.random() * 6) + 1;
  const r2 = Math.floor(Math.random() * 6) + 1;
  const sum = r1 + r2;
  const hitBig = sum >= 8;
  const win = (isBig && hitBig) || (!isBig && !hitBig && sum <= 6);

  sndTick();
  if (win) {
    pendingWin *= 2; sndWin(false); saveState();
    showToast(`点数 ${sum}！猜中翻倍为 ${pendingWin.toLocaleString()}`);
  } else {
    pendingWin = 0; sndThud(); saveState();
    showToast(`点数 ${sum}！比倍未中奖金归零`);
  }
  renderUI();
}

let historyList = [];
try {
  historyList = JSON.parse(localStorage.getItem("fruit_cabinet_history") || "[]");
  if (!Array.isArray(historyList)) historyList = [];
} catch (e) {}

function recordHistory(symbolName, winAmount, isLuck = false) {
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`;
  historyList.unshift({
    time: timeStr, symbol: symbolName, bet: totalBet(), win: winAmount
  });
  if (historyList.length > 50) historyList.pop();
  try { localStorage.setItem("fruit_cabinet_history", JSON.stringify(historyList)); } catch (e) {}
}

function renderUI() {
  document.getElementById("meterCredit").textContent = String(Math.max(0, S.credits)).padStart(8, "0");
  document.getElementById("meterWin").textContent = String(Math.max(0, pendingWin)).padStart(8, "0");

  DECK_ORDER.forEach((pi, colIdx) => {
    const betEl = document.getElementById("betLed" + colIdx);
    if (betEl) betEl.textContent = String(S.bets[pi]);

    const oddsEl = document.getElementById("oddsCell" + colIdx);
    if (oddsEl) {
      const isWon = !S.spinning && pendingWin > 0 && SYMS[wheel.targetFruit]?.p === pi;
      oddsEl.classList.toggle("winHit", isWon);
    }
  });

  const b = isBusy();
  const canGamble = !b && pendingWin > 0;
  document.getElementById("btnGambleSmall").disabled = !canGamble;
  document.getElementById("btnGambleBig").disabled = !canGamble;
  document.getElementById("btnGambleSmall").classList.toggle("glow", canGamble);
  document.getElementById("btnGambleBig").classList.toggle("glow", canGamble);

  document.getElementById("btnHalf").disabled = !(canGamble && pendingWin >= 2);
  document.getElementById("btnAll").disabled = !(canGamble && S.credits > 0);

  const btnGo = document.getElementById("btnGo");
  btnGo.disabled = b;
  btnGo.textContent = pendingWin > 0 ? "收分" : "GO";
  btnGo.classList.toggle("pulse", !b && (totalBet() > 0 || pendingWin > 0));
}

let toastTimer = 0;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
}

function bindHold(el, fn) {
  let iv = 0, to = 0;
  const start = e => {
    e.preventDefault(); fn();
    to = setTimeout(() => { iv = setInterval(fn, 110); }, 380);
  };
  const stop = () => { clearTimeout(to); clearInterval(iv); };
  el.addEventListener("pointerdown", start);
  el.addEventListener("pointerup", stop);
  el.addEventListener("pointerleave", stop);
  el.addEventListener("pointercancel", stop);
}

  };

  };

    document.getElementById("btnAudio").textContent = S.muted ? "静音" : "音效";

  document.getElementById("btnHist").onclick = () => {

      tbody.appendChild(tr);
    });
    document.getElementById("histModal").classList.add("show");
  };
  document.getElementById("btnCloseHist").onclick = () => {
    document.getElementById("histModal").classList.remove("show");

let lastNow = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastNow) / 1000 || 0.016);
  lastNow = now;
  updateWheel(dt);
  renderLamps(now);
  requestAnimationFrame(frame);
}

window.addEventListener("pointerdown", () => {
  try { getAc().resume(); } catch (e) {}
}, { once: true });

buildCabinetDOM();
renderUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
